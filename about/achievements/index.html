<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="meta.title">KORA Aerospace | Achievements</title>
    <meta name="description" content="" data-i18n="meta.description" data-i18n-attr="content">
    <link rel="icon" type="image/svg+xml" href="/media/icon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kora: { bg: '#222222', surface: '#2d2d2d', cyan: '#00f0ff', cyanDark: '#008b94', offwhite: '#f5f5f5' },
                    },
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
</head>

<body class="bg-kora-bg grid-bg overflow-x-hidden">
    <div id="navbar-placeholder"></div>

    <main class="min-h-screen bg-kora-bg selection:bg-kora-cyan selection:text-kora-bg pt-32 lg:pt-40 pb-24 lg:pb-32">
        <div class="max-w-7xl mx-auto px-6">
            <!-- Page Header -->
            <h1 class="text-4xl lg:text-5xl font-black text-kora-offwhite mb-12 lg:mb-16 uppercase tracking-tighter"
                id="page-title">Track Record</h1>

            <div class="flex flex-col lg:flex-row gap-12 lg:gap-16">
                <!-- Timeline -->
                <div class="lg:w-1/2 space-y-10 border-l border-slate-800 pl-6" id="timeline">
                    <!-- Entries loaded dynamically -->
                </div>

                <!-- Media Grid -->
                <div class="lg:w-1/2">
                    <div class="grid grid-cols-2 gap-4" id="media-grid">
                        <!-- Media loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>
    <div id="mobile-nav-placeholder"></div>

    <script src="/js/content-loader.js"></script>
    <script src="/js/component-loader.js"></script>
    <script src="/js/main.js"></script>
    <script>
        document.addEventListener('app-ready', async () => {
            const content = await contentLoader.loadContent('achievements');
            if (!content) return;

            const l = (obj) => contentLoader.getLocalizedValue(obj);

            document.getElementById('page-title').textContent = l(content.page?.title) || 'Track Record';

            // Render timeline entries
            const timeline = document.getElementById('timeline');
            if (content.entries && timeline) {
                timeline.innerHTML = content.entries.map(entry => `
            <div class="relative space-y-3">
              <div class="absolute -left-6 top-2 w-2 h-2 bg-kora-cyan sharp-edge"></div>
              <div class="text-kora-cyan font-black text-2xl leading-tight">${l(entry.date)}</div>
              <div class="inline-block bg-kora-cyan text-kora-bg text-[10px] font-black px-2 py-1 sharp-edge uppercase tracking-widest">
                ${l(entry.place)}
              </div>
              <h3 class="text-2xl font-black text-kora-offwhite uppercase tracking-tight leading-tight">${l(entry.title)}</h3>
              <p class="text-slate-100 leading-relaxed font-light">${l(entry.body)}</p>
            </div>
          `).join('');
            }

            // Render media
            const mediaGrid = document.getElementById('media-grid');
            if (content.media && mediaGrid) {
                mediaGrid.innerHTML = content.media.map((item, i) => `
            <div class="${i === 0 ? 'col-span-2 aspect-video' : 'aspect-square'} bg-kora-surface sharp-edge border border-slate-800 overflow-hidden relative group">
              <img
                src="${item.image}"
                alt="${l(item.alt)}"
                class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-all duration-700"
              />
              <div class="absolute top-4 left-4 bg-kora-bg px-2 py-1 text-[8px] lg:text-[10px] font-black text-slate-100 border border-slate-800 sharp-edge uppercase tracking-widest">${l(item.label)}</div>
            </div>
          `).join('');
            }
        });
    </script>
</body>

</html>
