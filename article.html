<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kora Aerospace Blog</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        .article-content {
            background: var(--kora-dark-lighter);
            padding: 2rem;
            border-radius: 1rem;
            margin-top: 2rem;
        }

        .article-content img {
            max-width: 100%;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .article-content h2,
        .article-content h3 {
            color: var(--kora-cyan);
            margin-top: 2rem;
        }

        .article-content p {
            margin-bottom: 1rem;
            color: var(--kora-white);
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <section class="section container" style="margin-top: 80px;">
        <a href="blog.html" class="nav-link">← Back to Blog</a>

        <div id="article-container" class="article-content">
            <p>Loading article...</p>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="vendor/js-yaml.min.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/component-loader.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="js/blog-engine.js"></script>
    <script src="js/app.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('post');
            const container = document.getElementById('article-container');

            if (slug && container) {
                const content = await fetchPost(slug);
                container.innerHTML = content;
            } else {
                container.innerHTML = '<p>Post not found.</p>';
            }
        });
    </script>
</body>

</html>
