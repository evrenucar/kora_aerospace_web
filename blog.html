<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Kora Aerospace</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div id="navbar-container"></div>

    <section class="section container" style="margin-top: 80px;">
        <h1 style="margin-bottom: 2rem;">Development Blog</h1>

        <div id="blog-feed" class="grid grid-cols-3">
            <!-- Posts injected via JS -->
            <p>Loading posts...</p>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="vendor/js-yaml.min.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/component-loader.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="js/blog-engine.js"></script>
    <script src="js/app.js"></script>

    <script>
        window.addEventListener('contentReady', async () => {
            const feed = document.getElementById('blog-feed');
            const posts = await fetchBlogIndex();

            if (feed) {
                feed.innerHTML = '';
                const lang = localStorage.getItem('kora_lang') || 'en';

                posts.forEach(post => {
                    const title = post.title[lang] || post.title['en'];
                    const summary = post.summary[lang] || post.summary['en'];

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div style="height: 150px; background-image: url('${post.image}'); background-size: cover; border-radius: 0.5rem; margin-bottom: 1rem;"></div>
                        <div style="font-size: 0.8rem; color: var(--kora-cyan); margin-bottom: 0.5rem;">${post.date} | ${post.category}</div>
                        <h3>${title}</h3>
                        <p style="color: var(--kora-gray); font-size: 0.9rem; margin-bottom: 1rem;">${summary}</p>
                        <a href="article.html?post=${post.slug}" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.5rem 1rem;">Read More</a>
                    `;
                    feed.appendChild(card);
                });
            }
        });
    </script>
</body>

</html>
