<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitions - Kora Aerospace</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div id="navbar-container"></div>

    <section class="section container" style="margin-top: 80px;">
        <h1 id="page-title">Competitions</h1>
        <p id="page-subtitle" style="color: var(--kora-gray); max-width: 700px; margin-bottom: 3rem;"></p>

        <div class="grid grid-cols-2" id="competitions-grid">
            <!-- Injected -->
            <p>Loading...</p>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="vendor/js-yaml.min.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/component-loader.js"></script>
    <script src="js/app.js"></script>
    <script>
        window.addEventListener('contentReady', () => {
            const data = window.siteData || siteData;
            if (data && data.competitions) {
                const lang = localStorage.getItem('kora_lang') || 'en';

                // Titles
                document.getElementById('page-title').textContent = data.competitions.title[lang];
                document.getElementById('page-subtitle').textContent = data.competitions.subtitle[lang];

                // Grid
                const grid = document.getElementById('competitions-grid');
                grid.innerHTML = data.competitions.items.map(comp => {
                    return `
                        <div class="card">
                            <span style="color: var(--kora-cyan); font-size: 0.9rem; font-weight: bold;">${comp.date}</span>
                            <h2 style="margin: 0.5rem 0;">${comp.title}</h2>
                            <p style="margin-bottom: 1rem; color: var(--kora-white);">${comp.description[lang]}</p>
                            <div style="background: rgba(0,0,0,0.3); padding: 0.5rem; border-radius: 0.5rem; font-size: 0.85rem;">
                                <strong>Objectives:</strong> ${comp.objectives[lang]}
                            </div>
                        </div>
                    `;
                }).join('');
            }
        });
    </script>
</body>

</html>
