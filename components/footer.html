<script>
    (async () => {
        if (siteData && siteData.footer) {
            const lang = localStorage.getItem('kora_lang') || 'en';
            const descEl = document.getElementById('footer-desc');
            const copyEl = document.getElementById('copyright');

            if (descEl && siteData.site && siteData.site.description) {
                descEl.textContent = siteData.site.description[lang];
            }
            if (copyEl) {
                copyEl.textContent = siteData.footer.copyright;
            }
        }
    })();
</script>
