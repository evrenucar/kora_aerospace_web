<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Kora Aerospace</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div id="navbar-container"></div>

    <section class="section container" style="margin-top: 80px;">
        <h1>Contact Us</h1>
        <div class="grid grid-cols-2">
            <div>
                <p style="margin-bottom: 2rem;">Interested in sponsorship, media inquiries, or joining the team?</p>

                <div class="card">
                    <h3>Get in Touch</h3>
                    <p><strong>Email:</strong> kora.aerospace@gmail.com</p>
                    <p><strong>Location:</strong> Ankara, TR / Delft, NL</p>
                </div>

                <div style="margin-top: 2rem;">
                    <h3>Sponsors</h3>
                    <p>Help us build the future.</p>
                    <a href="#" class="btn btn-primary" style="margin-top: 1rem;">View Sponsorship Deck</a>
                </div>
            </div>
            <div>
                <!-- Simple contact form layout -->
                <form class="card">
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem;">Name</label>
                        <input type="text"
                            style="width: 100%; padding: 0.5rem; background: rgba(0,0,0,0.2); border: 1px solid #334155; color: white; border-radius: 0.25rem;">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem;">Email</label>
                        <input type="email"
                            style="width: 100%; padding: 0.5rem; background: rgba(0,0,0,0.2); border: 1px solid #334155; color: white; border-radius: 0.25rem;">
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <label style="display: block; margin-bottom: 0.5rem;">Message</label>
                        <textarea rows="4"
                            style="width: 100%; padding: 0.5rem; background: rgba(0,0,0,0.2); border: 1px solid #334155; color: white; border-radius: 0.25rem;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="vendor/js-yaml.min.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/component-loader.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
