get_involved:
  title:
    en: "Back the team"
    tr: "Takımı Destekle"
  subtitle:
    en: "If you want us to win and keep flying, there are three ways to help:"
    tr: "Kazanıp uçmaya devam etmemizi istiyorsanız, desteklemenin üç yolu var:"
  options:
    - title:
        en: "Sponsor development"
        tr: "Ar-Ge'yi Destekleyin"
      body:
        en: "cash or in-kind support"
        tr: "nakit veya ayni destek"
    - title:
        en: "Provide equipment or fabrication"
        tr: "Ekipman veya üretim desteği"
      body:
        en: "PCB assembly, manufacturing, materials, sensors, electronics"
        tr: "PCB montajı, üretim, materyal, sensörler, elektronik"
    - title:
        en: "Enable testing"
        tr: "Test imkânı sağlayın"
      body:
        en: "safe test site access, field conditions, mentorship"
        tr: "güvenli test alanı erişimi, saha koşulları, mentorluk"
  cta:
    en: "Fill in our sponsor form to start a conversation"
    tr: "Sponsor formumuzu doldurun, iletişime geçelim"
  support_label:
    en: "// WHY YOUR SUPPORT MATTERS"
    tr: "// DESTEĞİNİZ NEDEN ÖNEMLİ"
  quote:
    en: '"We move fastest with funding, fabrication, and field access. Sponsors help us validate performance, iterate quickly, and show up ready on competition day."'
    tr: '"Fonlama, üretim ve saha erişimiyle en hızlı ilerliyoruz. Sponsorlar performansı doğrulamamıza, hızlı iterasyon yapmamıza ve yarışma gününe hazır çıkmamıza yardımcı olur."'

