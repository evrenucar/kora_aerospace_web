# Home Page Content

hero:
  title:
    en: 'We are building the smallest <span class="text-kora-cyan">AI-enabled fixed-wing</span> UAV with an onboard Jetson.'
    tr: 'Üzerinde Jetson bulunan en küçük <span class="text-kora-cyan">otonom sabit kanat</span> İHA''yı geliştiriyoruz.'
  subtitle:
    en: 'We are a competition team from METU and TU Delft. We bring cutting edge technology to every aspect of our design: <span class="text-kora-offwhite font-bold"> airframe, avionics, embedded, and autonomy.</span>'
    tr: 'METU ve TU Delft öğrencilerinden olulşan bir yarışma takımıyız. Her yönüyle en ileri teknolojiyi yarışmaya taşıyoruz: <span class="text-kora-offwhite font-bold"> gövde, aviyonik, gömülü ve otonomi.</span>'
  tagline:
    en: "Competition-tested engineers. Built with passion."
    tr: "Daha Küçük. Daha Hızlı. Daha Akıllı."

what_we_do:
  title:
    en: "What we do differently"
    tr: "Farkımız"
  cards:
    - title:
        en: "Here to win, not to compete"
        tr: "Yarışmak için değil, kazanmak için buradayız"
      body:
        en: "We are not here just to participate. We are here to win by pushing the boundaries on every aspect of our design."
        tr: "Sadece katılmak için burada değiliz. Tasarımımızın her yönünde sınırları zorlayarak kazanmaya geliyoruz."
    - title:
        en: "All systems tailored for the competition"
        tr: "Tüm sistemler yarışmaya özel geliştirildi"
      body:
        en: "State of the art vision pipeline, custom electronics, custom airframe. No corners cut. No stone unturned. No team has ever done this level of customisation and integration"
        tr: "En ileri görüş hattı, özel elektronikler, özel gövde. Her şeyin en iyisini yapıyoruz. Hiçbir takım bu seviyede özelleştirme ve entegrasyon yapmadı."
    - title:
        en: "Smallest Fixed wing UAV with onboard Jetson ever"
        tr: "Jetson'lu en küçük sabit kanat İHA"
      body:
        en: "The design we are building will be the smallest fixed-wing UAV with an onboard Jetson ever flown. Not just in competitions, but in general."
        tr: "Geliştirdiğimiz tasarım, Jetson taşıyan en küçük sabit kanat İHA olacak. Sadece yarışmalarda değil, genel olarak."

milestones:
  title:
    en: "Milestones"
    tr: "Kilometre Taşları"
  subtitle:
    en: "We're building a platform step by step."
    tr: "Adım adım bir platform inşa ediyoruz."
  label:
    en: "// NEAR_TERM_MILESTONES"
    tr: "// YAKIN VADE KİLOMETRE TAŞLARI"
  items:
    - title:
        en: "Autonomy-ready avionics PCB"
        tr: "Otonomiye hazır aviyonik PCB"
      body:
        en: "Power + compute + sensing integrated for compact form factors."
        tr: "Küçük forma yönelik güç + aviyonik + görüntü işleme entegrasyonu."
    - title:
        en: "Perception + mission pipeline"
        tr: "Görüntü işleme + Görev hattı"
      body:
        en: "Running fully onboard for real-time rapid decisions."
        tr: "Gerçek zamanlı hızlı kararlar için tamamen yerleşik çalışıyor."
    - title:
        en: "Airframe Flight validation"
        tr: "Gövde uçuş doğrulaması"
      body:
        en: "Consistent logging + repeatable test routes in field conditions."
        tr: "Saha koşullarında tutarlı kayıtlar + tekrarlanabilir test rotaları."
    - title:
        en: "Competition demonstration"
        tr: "Yarışma gösterimi"
      body:
        en: "Systems validated in multi-vehicle tests and finally demonstrated at SUAS and Teknofest."
        tr: "Sistemler çoklu araç testlerinde doğrulanıyor ve sonunda SUAS ve Teknofest'te gösteriliyor."

sponsorship_enables:
  title:
    en: "What sponsorship directly enables"
    tr: "Sponsorluk doğrudan şunları sağlar"
  items:
    - en: "PCB fabrication + assembly spins"
      tr: "PCB üretimi + montaj revizyonları"
    - en: "Sensor and compute hardware"
      tr: "Sensör ve hesaplama donanımı"
    - en: "Airframe prototyping materials and tooling"
      tr: "Gövde prototipleme malzemeleri ve takım"
    - en: "Batteries, RF/telemetry gear, and test equipment"
      tr: "Bataryalar, RF/telemetri ekipmanları ve test cihazları"
    - en: "Field testing logistics and competition travel"
      tr: "Saha test lojistiği ve yarışma seyahati"

