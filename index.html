<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kora Aerospace</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <!-- Design Tweaks specific to Home -->
  <style>
    .hero {
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('assets/images/hero-bg.jpg');
      background-size: cover;
      background-position: center;
      text-align: center;
      margin-top: -80px;
      /* Counter navbar height */
      padding-top: 80px;
    }

    .hero h1 {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      text-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .hero p {
      font-size: 1.25rem;
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>

<body>

  <!-- Shared Navbar Container -->
  <div id="navbar-container"></div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1 data-content="site.title">Kora Aerospace</h1> <!-- Fallback content -->
      <p id="hero-desc">Pioneering the future of autonomous flight.</p>
      <div class="flex gap-4 justify-center">
        <a href="vehicle.html" class="btn btn-primary">Our Vehicle</a>
        <a href="team.html" class="btn btn-outline">Meet the Team</a>
      </div>
    </div>
  </section>

  <!-- Quick Nav Grid -->
  <section class="section container">
    <div class="grid grid-cols-3">
      <div class="card">
        <h3>Our Team</h3>
        <p>Meet the minds behind the machine.</p>
        <a href="team.html" class="btn btn-primary" style="margin-top: 1rem; font-size: 0.8rem;">View Team</a>
      </div>
      <div class="card">
        <h3>Latest Media</h3>
        <p>Watch our latest flight tests and galleries.</p>
        <a href="media.html" class="btn btn-primary" style="margin-top: 1rem; font-size: 0.8rem;">Watch Now</a>
      </div>
      <div class="card">
        <h3>Dev Blog</h3>
        <p>Deep dives into our engineering challenges.</p>
        <a href="blog.html" class="btn btn-primary" style="margin-top: 1rem; font-size: 0.8rem;">Read Blog</a>
      </div>
    </div>
  </section>

  <!-- Shared Footer Container -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="vendor/js-yaml.min.js"></script>
  <script src="js/content-loader.js"></script>
  <script src="js/component-loader.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Page specific logic
    window.addEventListener('contentReady', () => {
      if (siteData && siteData.site && siteData.site.description) {
        const lang = localStorage.getItem('kora_lang') || 'en';
        document.getElementById('hero-desc').textContent = siteData.site.description[lang];
      }
    });
  </script>
</body>

</html>
