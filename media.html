<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media - Kora Aerospace</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <style>
        .filter-btn {
            background: transparent;
            border: 1px solid var(--kora-gray);
            color: var(--kora-gray);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active,
        .filter-btn:hover {
            border-color: var(--kora-cyan);
            color: var(--kora-cyan);
            background: rgba(6, 182, 212, 0.1);
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <section class="section container" style="margin-top: 80px;">
        <h1>Media Gallery</h1>
        <p style="color: var(--kora-gray); margin-bottom: 2rem;">Photos, videos, and press assets.</p>

        <!-- Filters -->
        <div class="flex gap-4" style="margin-bottom: 2rem;">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Vehicle</button>
            <button class="filter-btn">Team</button>
            <button class="filter-btn">Competitions</button>
            <button class="filter-btn">Press Kit</button>
        </div>

        <div class="grid grid-cols-3">
            <!-- Placeholders for now since we don't have a media index yet -->
            <div class="card">
                <div style="height: 200px; background: #334155; border-radius: 0.5rem; margin-bottom: 1rem;"></div>
                <h3>Flight Test Alpha</h3>
                <p style="color: var(--kora-gray); font-size: 0.8rem;">Vehicle • 2024</p>
            </div>
            <div class="card">
                <div style="height: 200px; background: #334155; border-radius: 0.5rem; margin-bottom: 1rem;"></div>
                <h3>Team Workshop</h3>
                <p style="color: var(--kora-gray); font-size: 0.8rem;">Team • 2024</p>
            </div>
            <div class="card">
                <div style="height: 200px; background: #334155; border-radius: 0.5rem; margin-bottom: 1rem;"></div>
                <h3>Teknofest 2021</h3>
                <p style="color: var(--kora-gray); font-size: 0.8rem;">Competitions • 2021</p>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="vendor/js-yaml.min.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/component-loader.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
