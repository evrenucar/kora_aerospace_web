<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle - Kora Aerospace</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <div id="navbar-container"></div>

    <section class="section container" style="margin-top: 80px;">
        <h1>The Vehicle</h1>
        <p style="max-width: 800px; font-size: 1.2rem; color: var(--kora-gray); margin-bottom: 3rem;">
            Our latest autonomous UAV platform designed for high-endurance missions.
        </p>

        <div class="grid grid-cols-2">
            <div>
                <div style="height: 300px; background: #334155; border-radius: 1rem; width: 100%;"></div>
            </div>
            <div>
                <h2>Specifications</h2>
                <ul style="list-style: none; padding: 0; margin-top: 1rem;">
                    <li style="border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem 0;">
                        <strong>Wingspan:</strong> 2.4m
                    </li>
                    <li style="border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem 0;">
                        <strong>MTOW:</strong> 12kg
                    </li>
                    <li style="border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem 0;">
                        <strong>Endurance:</strong> 90 mins
                    </li>
                    <li style="border-bottom: 1px solid rgba(255,255,255,0.1); padding: 1rem 0;">
                        <strong>Payload:</strong> 2kg
                    </li>
                </ul>
            </div>
        </div>
    </section>

    <div id="footer-container"></div>

    <script src="vendor/js-yaml.min.js"></script>
    <script src="js/content-loader.js"></script>
    <script src="js/component-loader.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
